name: "Docker Build & Push"
description: "Builds a Docker image and pushes it to a container registry"
outputs:
  image_digest:
    description: "Digest of the pushed primary image tag"
    value: ${{ steps.resolve_digest.outputs.digest }}
inputs:
  app:
    description: "Application to build"
    required: true
  dockerfile:
    description: "Dockerfile to build"
    required: false
    default: "Dockerfile"
  dockerignore_override:
    description: "Override default .dockerignore file from context"
    required: false
  context:
    description: "Docker build context"
    required: false
    default: "."
  tag:
    description: "Docker image tag"
    required: false
    default: "${{ github.sha }}"
  extra_tag:
    description: "Additional Docker image tag to publish alongside the primary tag, e.g. latest or a version"
    required: false
    default: ""
  directory:
    description: "Directory to change into before building"
    required: false
    default: "."
  args:
    description: "Additional 'docker build' arguments"
    required: false
    default: ""
  registry_address:
    description: "Container registry address"
    required: true
  registry_username:
    description: "Container registry username"
    required: true
  registry_password:
    description: "Container registry password"
    required: true

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v4

    - name: Display build information
      shell: bash
      working-directory: ${{ inputs.directory }}
      run: |
        echo "[INFO] Build Information ℹ️"
        echo "[INFO] "
        echo "[INFO] Image Details"
        echo "[INFO]  • Full image name: ${{ inputs.registry_address }}/${{ inputs.app }}:${{ inputs.tag }}"
        echo "[INFO]  • Application:     ${{ inputs.app }}"
        echo "[INFO]  • Registry:        ${{ inputs.registry_address }}"
        echo "[INFO]  • Primary tag:     ${{ inputs.tag }}"
        if [ -n "${{ inputs.extra_tag }}" ]; then
          echo "[INFO]  • Additional tag:  ${{ inputs.extra_tag }}"
          echo "[INFO]  • Extra image:      ${{ inputs.registry_address }}/${{ inputs.app }}:${{ inputs.extra_tag }}"
        fi
        echo ""
        echo "[INFO] Build Context"
        echo "[INFO]  • Dockerfile:      ${{ inputs.dockerfile }}"
        echo "[INFO]  • Context path:    ${{ inputs.context }}"
        echo "[INFO]  • Working dir:     ${{ inputs.directory }}"
        echo "[INFO]  • Build args:      ${{ inputs.args }}"
        echo "[INFO]  • Dockerignore:    ${{ inputs.dockerignore_override || 'default' }}"

    - name: Configure .dockerignore override
      if: inputs.dockerignore_override != ''
      shell: bash
      working-directory: ${{ inputs.directory }}
      run: |
        cp "${{ inputs.context }}/.dockerignore" "${{ inputs.context }}/.dockerignore.bak"
        cp "${{ inputs.dockerignore_override }}" "${{ inputs.context }}/.dockerignore"

    - name: Build Docker image
      shell: bash
      working-directory: ${{ inputs.directory }}
      run: |
        docker buildx build \
          --tag ${{ inputs.registry_address }}/${{ inputs.app }}:${{ inputs.tag }} \
          --file ${{ inputs.dockerfile }} \
          ${{ inputs.context }} \
          ${{ inputs.args }}

    - name: Tag image with additional tag
      if: inputs.extra_tag != ''
      shell: bash
      run: |
        docker tag \
          "${{ inputs.registry_address }}/${{ inputs.app }}:${{ inputs.tag }}" \
          "${{ inputs.registry_address }}/${{ inputs.app }}:${{ inputs.extra_tag }}"

    - name: Restore original .dockerignore
      if: inputs.dockerignore_override != ''
      shell: bash
      working-directory: ${{ inputs.directory }}
      run: mv "${{ inputs.context }}/.dockerignore.bak" "${{ inputs.context }}/.dockerignore"

    - name: Login to registry
      uses: docker/login-action@v3
      with:
        registry: ${{ inputs.registry_address }}
        username: ${{ inputs.registry_username }}
        password: ${{ inputs.registry_password }}
        logout: false

    - name: Push image to registry
      shell: bash
      run: docker push "${{ inputs.registry_address }}/${{ inputs.app }}:${{ inputs.tag }}"

    - name: Push additional tag to registry
      if: inputs.extra_tag != ''
      shell: bash
      run: docker push "${{ inputs.registry_address }}/${{ inputs.app }}:${{ inputs.extra_tag }}"

    - name: Resolve pushed image digest
      id: resolve_digest
      shell: bash
      run: |
        set -euo pipefail

        image_tag="${{ inputs.registry_address }}/${{ inputs.app }}:${{ inputs.tag }}"
        digest="$(
          docker buildx imagetools inspect "$image_tag" --format '{{json .}}' \
            | jq -r '.digest // empty'
        )"

        if [[ -z "$digest" ]]; then
          echo "Could not resolve image digest for $image_tag"
          exit 1
        fi

        echo "digest=$digest" >> "$GITHUB_OUTPUT"
        echo "Resolved digest: $digest"
